<!DOCTYPE>
<html>
<head>
<meta charset="UTF-8">
<title>Ivan Fokin</title>
</head>
<body>
<script language="JavaScript">
function Pole_fokin(a_fok,b_fok)
{
var wynik_fok = a_fok*b_fok;
document.getElementById("wyprowadz_pole_fok").value = wynik_fok.toFixed(2)+" cm^2";
}
function obwod_fokin(a_fok,b_fok)
{
var wynik_fok = 2*a_fok+2*b_fok;
document.getElementById("wyprowadz_obwod_fok").value = wynik_fok.toFixed(2)+" cm";
}
</script>

<h1>Obliczanie pola i obwodu prostokąta</h1>
Podaj długość boku a:
<input type="text" id="a_dana_fok"> cm<br><br>
Podaj długość boku b:
<input type="text" id="b_dana_fok"> cm<br>
<input type="button" name="pole" value="Oblicz pole"  onclick="Pole_fokin(parseFloat(document.getElementById('a_dana_fok').value),parseFloat(document.getElementById('b_dana_fok').value))"><br><br>
<input type="button" name="obw" value="Oblicz obwód" onclick="obwod_fokin(parseFloat(document.getElementById('a_dana_fok').value),parseFloat(document.getElementById('b_dana_fok').value))"><br><br>
Pole
<input type="text" name="pole" id="wyprowadz_pole_fok">
Obwód
<input type="text" name="obw" id="wyprowadz_obwod_fok">
</body>
</html>
